name: Build Bytes Music APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-37" "build-tools;37.0.0" || true

    - name: Build universal FOSS debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalFossDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: Bytes-Music-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
